- id: '1768333120765'
  alias: Enter Highland
  description: ''
  # Zone trigger on the entity, not a device_id. A device trigger breaks
  # whenever the companion app re-registers (it did on 2026-07-27); the
  # entity name survives. The old empty `event_type: ''` trigger never fired.
  triggers:
  - trigger: zone
    entity_id: device_tracker.le2113
    zone: zone.home
    event: enter
  conditions: []
  actions:
  - action: media_player.play_media
    metadata: {}
    target:
      entity_id: media_player.living_room
    data:
      media:
        media_content_id: media-source://radio_browser/96159d2f-0601-11e8-ae97-52543be04c81
        media_content_type: audio/x-mpegurl
        metadata:
          title: Highland Radio
          thumbnail: https://highlandradio.com/wp-content/uploads/2022/01/cropped-highland-favicon-01-180x180.png
          media_class: music
          children_media_class:
          navigateIds:
          - {}
          - media_content_type: app
            media_content_id: media-source://radio_browser
          - media_content_type: music
            media_content_id: media-source://radio_browser/country/IE
          browse_entity_id: media_player.living_room
  mode: single

- id: reminders_due
  alias: Announce reminders when they fall due
  description: >-
    Checks todo.reminders once a minute for anything whose due date/time has
    passed, pushes it to both phones, then marks it completed.

    Marking completed is deliberate and does two jobs: it stops the same
    reminder firing every minute, and it means a reminder that came due while
    Home Assistant was restarting still fires on the next check rather than
    being silently missed. The notification IS the reminder; the list is not
    meant to be a permanent record.

    An all-day item (due: 2026-08-20, no time) is treated as due at 08:00 that
    morning, not midnight — otherwise "go to the bank today" would alert the
    instant it was added and immediately mark itself done.
  triggers:
  - trigger: time_pattern
    minutes: /1
  conditions: []
  actions:
  - action: todo.get_items
    target:
      entity_id: todo.reminders
    data:
      status: needs_action
    response_variable: todo_result
  - variables:
      due_now: >-
        {% set ns = namespace(items=[]) %}
        {% for i in todo_result['todo.reminders']['items'] %}
          {% set d = i.due | default(none) %}
          {% if d %}
            {# An all-day to-do (due: 2026-08-20, no time) would otherwise be
               "due" at 00:00 and fire the instant it is added for today.
               Treat date-only items as due at 08:00 that morning. #}
            {% set dstr = d | string %}
            {% set eff = (dstr ~ 'T08:00:00') if dstr | length == 10 else dstr %}
            {% set ts = as_timestamp(eff, 0) %}
            {% if ts and ts <= as_timestamp(now()) %}
              {% set ns.items = ns.items + [i] %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ ns.items }}
  - condition: template
    value_template: "{{ due_now | count > 0 }}"
  - repeat:
      for_each: "{{ due_now }}"
      sequence:
      - action: notify.mobile_app_le2113
        data:
          title: "⏰ Reminder"
          message: >-
            {{ repeat.item.summary }}{% if repeat.item.description %}

            {{ repeat.item.description }}{% endif %}
          data:
            tag: "reminder-{{ repeat.item.uid }}"
            channel: Reminders
            importance: high
      - action: notify.mobile_app_kinnego_pixel
        data:
          title: "⏰ Reminder"
          message: >-
            {{ repeat.item.summary }}{% if repeat.item.description %}

            {{ repeat.item.description }}{% endif %}
          data:
            tag: "reminder-{{ repeat.item.uid }}"
            channel: Reminders
            importance: high
      - action: todo.update_item
        target:
          entity_id: todo.reminders
        data:
          item: "{{ repeat.item.uid }}"
          status: completed
  mode: single
  max_exceeded: silent

- id: ring_front_door_snapshot
  alias: Snapshot the front door on ding or motion
  description: >-
    camera.front_door_live_view has no still image — video_url and
    last_video_id are both null, because recorded stills need a Ring Protect
    subscription. So the camera page had nothing to display until you tapped
    the card and started a stream. This grabs a JPEG when something actually
    happens at the door and writes it to www/ring/, which the dashboard shows
    directly. Each snapshot briefly wakes a battery-powered doorbell, so the
    trailing delay plus mode:single throttles it to at most one every two
    minutes no matter how much the motion sensor chatters.
  triggers:
  - trigger: state
    entity_id: event.front_door_ding
  - trigger: state
    entity_id: event.front_door_motion
  conditions:
  - condition: template
    value_template: "{{ trigger.to_state.state not in ['unknown','unavailable'] }}"
  actions:
  - action: camera.snapshot
    target:
      entity_id: camera.front_door_live_view
    data:
      filename: /config/www/ring/front_door_latest.jpg
  - delay: "00:02:00"
  mode: single

- id: ev_tariff_window_switch
  alias: Switch energy tariff at EV window boundaries
  description: >-
    Flips the utility_meter tariff selects between ev_window and day_rate so
    grid import, hot water and EV charging accumulate into separate cheap-rate
    and day-rate buckets. Window comes from binary_sensor.ev_tariff_window,
    which is the single place the hours are defined. Also runs at startup so
    the meters cannot be left on the wrong tariff after a restart.
  triggers:
  - trigger: state
    entity_id: binary_sensor.ev_tariff_window
    to:
    - 'on'
    - 'off'
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: select.select_option
    target:
      entity_id:
      - select.grid_import_split
      - select.hot_water_split
      - select.ev_charging_split
    data:
      option: >-
        {{ 'ev_window' if is_state('binary_sensor.ev_tariff_window','on')
           else 'day_rate' }}
  mode: single
