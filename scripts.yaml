all_off:
  alias: All Off
  icon: mdi:power
  mode: single
  sequence:
    - choose:
        - conditions:
            - condition: state
              entity_id: light.fire_lamp_2
              state: "on"
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.fire_lamp_2

    - choose:
        - conditions:
            - condition: state
              entity_id: light.corner_lamp
              state: "on"
          sequence:
            - service: light.turn_off
              target:
                entity_id: light.corner_lamp

    - choose:
        - conditions:
            - condition: not
              conditions:
                - condition: state
                  entity_id: media_player.lg_webos_tv_7166
                  state: "off"
          sequence:
            - service: media_player.turn_off
              target:
                entity_id: media_player.lg_webos_tv_7166
night_mode_on:
  alias: Evening Mode
  icon: mdi:weather-night
  mode: single
  sequence:
    - service: light.turn_on
      target:
        entity_id:
          - light.fire_lamp_2
          - light.corner_lamp
      data:
        brightness_pct: 20

    - service: media_player.turn_on
      target:
        entity_id: media_player.lg_webos_tv_7166

morning_mode:
  alias: Good Night
  icon: mdi:sleep
  mode: single
  sequence:
    - service: light.turn_off
      target:
        entity_id:
          - light.fire_lamp_2
          - light.corner_lamp

    - service: media_player.turn_off
      target:
        entity_id: media_player.lg_webos_tv_7166

# One-shot reset of test data. Uses the integration's own service, which keeps
# every definition (girls, chores, rewards, penalties, bonuses) and clears only
# runtime state: points, claims, approvals, streaks and statistics. It writes
# its own backup to .storage/choreops/choreops_data_<timestamp>_reset first.
# Delete this script once it has been run.
choreops_reset_test_data:
  alias: ChoreOps - Reset Test Data
  icon: mdi:backup-restore
  mode: single
  sequence:
    - service: choreops.reset_transactional_data
      data:
        confirm_destructive: true
        scope: global
