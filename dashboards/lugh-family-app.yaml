title: Family
views:
  # The out-and-about view. Deliberately NOT kiosk_mode: this is opened in the
  # Companion app or as a home-screen shortcut, where the header is the way
  # back out. max_columns 2 means one column on a phone, two on a tablet.
  - title: Today
    path: today
    icon: mdi:home-heart
    theme: Lugh Energy Kiosk
    type: sections
    max_columns: 2
    sections:

      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |-
              {%- set rem = states('todo.reminders') | int(0) -%}
              {%- set shop = states('todo.shopping_list') | int(0) -%}
              {%- set ev = state_attr('calendar.family_wall','message') -%}
              {%- set evs = state_attr('calendar.family_wall','start_time') -%}
              ## {{ now().strftime('%A %-d %B') }}

              {% if rem or shop -%}
              **{{ rem }}** to do · **{{ shop }}** on the shopping list
              {%- else -%}
              Nothing outstanding. 🎉
              {%- endif %}
              {%- if ev and states('calendar.family_wall') == 'on' %}

              📅 On now: **{{ ev }}**
              {%- elif ev %}

              📅 Next: **{{ ev }}**{% if evs %} at {{ evs[11:16] }}{% endif %}
              {%- endif %}
              {%- set cd = state_attr('sensor.cassie_choreops_chores','chore_stat_current_due_today') | int(0) %}
              {%- set ad = state_attr('sensor.alyssa_choreops_chores','chore_stat_current_due_today') | int(0) %}
              {%- if cd or ad %}

              ⭐ Chores left today — Cassie **{{ cd }}**, Alyssa **{{ ad }}**
              {%- endif %}
            card_mod:
              style: |
                ha-card { background: linear-gradient(135deg, rgba(18,8,30,.95), rgba(6,13,23,.95));
                          border: 1px solid rgba(187,108,255,.40); border-radius: 22px; }
                h2 { color: #D2A4FF; letter-spacing: .06em; margin-bottom: 4px; }

          # The incentive, on the landing page rather than buried a view deep:
          # the next reward each girl has not reached yet, and the gap to it.
          - type: markdown
            content: |-
              {% for kid, label, emoji in [('cassie','Cassie','⭐'), ('alyssa','Alyssa','🌸')] %}
              {%- set p = states('sensor.' ~ kid ~ '_choreops_points') | float(0) -%}
              {%- set rw = states.sensor
                   | selectattr('attributes.purpose','eq','purpose_reward_status')
                   | selectattr('attributes.user_name','eq',label)
                   | sort(attribute='attributes.cost') | list -%}
              {%- set nxt = rw | selectattr('attributes.cost','gt', p) | list -%}
              {%- set can = rw | selectattr('attributes.cost','le', p) | list | count -%}
              {%- if nxt | count -%}
              {%- set r = nxt | first -%}
              {%- set c = r.attributes.cost | float(1) -%}
              {%- set n = (p / c * 10) | round(0,'floor') | int -%}
              {%- set f = 10 if n > 10 else n -%}
              - {{ emoji }} **{{ label }}** {{ p | round(0) | int }} · {{ '█' * f }}{{ '░' * (10 - f) }} {{ r.attributes.reward_name }} — **{{ (c - p) | round(0) | int }} to go**{% if can %} · {{ can }} ready now{% endif %}
              {%- else -%}
              - {{ emoji }} **{{ label }}** {{ p | round(0) | int }} · everything unlocked 🎉
              {%- endif %}
              {% endfor %}
            tap_action:
              action: navigate
              navigation_path: /family-app/chores
            card_mod:
              style: |
                ha-card { background: rgba(10,8,24,.92);
                          border: 1px solid rgba(187,108,255,.42); border-radius: 22px; }
          # Pinned to the Lu pipeline so it always reaches the tuned agent.
          - type: button
            name: Ask Lugh
            icon: mdi:microphone
            tap_action:
              action: assist
              pipeline_id: 01ky36ghxprgc00rgc1z2bstgf
              start_listening: true
            card_mod:
              style: |
                ha-card { background: rgba(31,111,235,.22);
                          border: 1px solid rgba(88,166,255,.55); border-radius: 22px; }

      # ------------------------------------------------------------- TO DO --
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: To do
            icon: mdi:checkbox-marked-circle-outline
            badges:
              - type: entity
                entity: todo.reminders
          # Type to add. Tap an item to set a due date/time — that is what makes
          # it push to both phones. An item with a date but no time alerts at
          # 08:00 that morning, which is the "bank today" case.
          - type: todo-list
            entity: todo.reminders

      # ---------------------------------------------------------- SHOPPING --
      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Shopping
            icon: mdi:cart-outline
            badges:
              - type: entity
                entity: todo.shopping_list
          - type: todo-list
            entity: todo.shopping_list

      # ---------------------------------------------------------- CALENDAR --
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: Family calendar
            icon: mdi:calendar-heart
          # Read-only: FamilyWall is an ICS feed in, with no write-back.
          - type: calendar
            initial_view: listWeek
            entities:
              - calendar.family_wall
            card_mod:
              style: |
                ha-card { background: rgba(5,12,20,.94);
                          border: 1px solid rgba(187,108,255,.28); border-radius: 22px; }

      # ------------------------------------------------------------ HOUSE --
      # A few things worth knowing when you are out, not a control panel.
      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: House
            icon: mdi:home-outline
          - type: markdown
            content: |-
              {%- set home = states.person | selectattr('state','eq','home') | list | count -%}
              {%- set lights = states.light | selectattr('state','eq','on') | list | count -%}
              {%- set gen = states('sensor.kinnegoz_myenergi_kinnegoz_power_generation') | float(0) -%}
              🏠 **{{ home }} home** · 💡 **{{ lights }} lights on**
              {% if gen > 50 %}· ☀️ **{{ (gen/1000) | round(1) }} kW** solar{% endif %}
            card_mod:
              style: |
                ha-card { background: rgba(4,12,20,.94);
                          border: 1px solid rgba(57,213,255,.30); border-radius: 22px; }
          - type: button
            name: Cameras
            icon: mdi:cctv
            tap_action:
              action: navigate
              navigation_path: /lugh-cameras/main
          - type: button
            name: Energy
            icon: mdi:lightning-bolt
            tap_action:
              action: navigate
              navigation_path: /lugh-energy/energy
          - type: button
            name: Chores
            icon: mdi:star-circle
            tap_action:
              action: navigate
              navigation_path: /family-app/chores

  # Landing page for the printed fridge QR code. Deliberately one card and
  # nothing else — it is scanned mid-cooking with one hand, so anything extra
  # is in the way. Reachable at /family-app/shopping.
  - title: Shopping
    path: shopping
    icon: mdi:cart
    theme: Lugh Energy Kiosk
    type: sections
    max_columns: 1
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: markdown
            content: |-
              {%- set n = states('todo.shopping_list') | int(0) -%}
              ## 🛒 Shopping
              {% if n %}**{{ n }}** item{{ '' if n == 1 else 's' }} on the list{% else %}List is empty{% endif %}
            card_mod:
              style: |
                ha-card { background: rgba(10,8,24,.92);
                          border: 1px solid rgba(187,108,255,.42); border-radius: 22px; }
                h2 { color: #D2A4FF; letter-spacing: .06em; }
          - type: todo-list
            entity: todo.shopping_list
          - type: button
            name: Add by voice
            icon: mdi:microphone
            tap_action:
              action: assist
              pipeline_id: 01ky36ghxprgc00rgc1z2bstgf
              start_listening: true
            card_mod:
              style: |
                ha-card { background: rgba(31,111,235,.22);
                          border: 1px solid rgba(88,166,255,.55); border-radius: 22px; }

  # ---------------------------------------------------------------- CHORES --
  # Same content as the /lugh-chores iPad kiosk, without kiosk_mode so the
  # header stays available for navigation in the Companion app.
  - title: Chores
    path: chores
    icon: mdi:star-circle
    theme: Lugh Energy Kiosk
    type: sections
    max_columns: 2

    sections:
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |-
              {%- set cp = states('sensor.cassie_choreops_points') | int(0) -%}
              {%- set ap = states('sensor.alyssa_choreops_points') | int(0) -%}
              {%- set cd = state_attr('sensor.cassie_choreops_chores','chore_stat_current_due_today') | int(0) -%}
              {%- set ad = state_attr('sensor.alyssa_choreops_chores','chore_stat_current_due_today') | int(0) -%}
              # ⭐ REWARD CHART
              
              **{{ now().strftime('%A, %-d %B') }}**
              
              ⭐ **Cassie {{ cp }}** · {{ cd }} left today  ·  🌸 **Alyssa {{ ap }}** · {{ ad }} left today
            card_mod:
              style: |
                ha-card { background: linear-gradient(110deg, rgba(5,13,24,.97), rgba(7,19,30,.92));
                          border: 1px solid rgba(187,108,255,.35); border-radius: 22px;
                          padding: 6px 18px; }
                h1 { letter-spacing: .16em; color: #D2A4FF; margin-bottom: 4px; font-size: 30px; }
                @media (max-width: 600px) {
                  h1 { font-size: 24px; letter-spacing: .08em; }
                }

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Cassie
            icon: mdi:star-circle
            badges:
              - type: entity
                entity: sensor.cassie_choreops_points
          # Pick what she is saving for; the gauge below reads this.
          - type: entities
            entities:
              - entity: input_select.cassie_reward_goal
                name: Saving for
                icon: mdi:target
          # Native gauge: no markdown, no card_mod, no custom cards in the path,
          # so this renders even if one of those fails to load in the browser.
          - type: gauge
            entity: sensor.cassie_goal_progress
            name: Progress
            min: 0
            max: 100
            severity:
              green: 80
              yellow: 40
              red: 0
          # Markdown, not a tile with state_content: a tile puts the goal on one
          # nowrap line and ellipsises anything past ~35 characters, which hides
          # exactly the detail worth reading.
          - type: markdown
            content: |-
              {%- set r = state_attr('sensor.cassie_goal_progress','reward') -%}
              {%- set t = state_attr('sensor.cassie_goal_progress','to_go') -%}
              {%- set pct = states('sensor.cassie_goal_progress') | int(0) -%}
              🎁 **{{ r }}**

              {{ pct }}% of the way there — {{ t }}
          # Rewards ABOVE the chores: the incentive is the reason the panel is
          # on the wall, and burying it under 11 tiles was the original mistake.
          - type: markdown
            content: |-
              {%- set p = states('sensor.cassie_choreops_points') | float(0) -%}
