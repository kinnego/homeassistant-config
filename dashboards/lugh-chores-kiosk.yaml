                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.cassie_choreops_claim_chore_get_dressed_for_school
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.cassie_choreops_claim_chore_get_dressed_for_school
              - type: tile
