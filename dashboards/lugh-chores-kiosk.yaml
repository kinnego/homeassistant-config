title: Chores
background: "#03070d"

# Kiosk build of the reward chart, sized for an iPad in landscape.
# max_columns 2 puts one girl per column so nothing needs scrolling on a 1024-wide
# screen; on a phone it collapses to a single column. Rewards sit above the chore
# tiles deliberately - see the comment in the section below.
#
# NOTE: the trusted_networks auth bypass in configuration.yaml is scoped to the
# wall-panel Pi (192.168.1.82/32) ONLY. An iPad will therefore have to log in
# normally the first time. Widening that rule is a human decision, not one to
# make here.

views:
  - title: Chores
    path: chores
    icon: mdi:star-circle
    theme: Lugh Energy Kiosk
    type: sections
    max_columns: 2

    kiosk_mode:
      kiosk: true
      hide_header: true
      hide_sidebar: true

    sections:
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |-
              {%- set cp = states('sensor.cassie_choreops_points') | int(0) -%}
              {%- set ap = states('sensor.alyssa_choreops_points') | int(0) -%}
              {%- set cd = state_attr('sensor.cassie_choreops_chores','chore_stat_current_due_today') | int(0) -%}
              {%- set ad = state_attr('sensor.alyssa_choreops_chores','chore_stat_current_due_today') | int(0) -%}
              # ⭐ REWARD CHART
              
              **{{ now().strftime('%A, %-d %B') }}**
              
              ⭐ **Cassie {{ cp }}** · {{ cd }} left today  ·  🌸 **Alyssa {{ ap }}** · {{ ad }} left today
            card_mod:
              style: |
                ha-card { background: linear-gradient(110deg, rgba(5,13,24,.97), rgba(7,19,30,.92));
                          border: 1px solid rgba(187,108,255,.35); border-radius: 22px;
                          padding: 6px 18px; }
                h1 { letter-spacing: .16em; color: #D2A4FF; margin-bottom: 4px; font-size: 30px; }
                @media (max-width: 600px) {
                  h1 { font-size: 24px; letter-spacing: .08em; }
                }

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: Cassie
            icon: mdi:star-circle
            badges:
              - type: entity
                entity: sensor.cassie_choreops_points
          # Pick what she is saving for; the gauge below reads this.
          - type: entities
            entities:
              - entity: input_select.cassie_reward_goal
                name: Saving for
                icon: mdi:target
          # Native gauge: no markdown, no card_mod, no custom cards in the path,
          # so this renders even if one of those fails to load in the browser.
          - type: gauge
            entity: sensor.cassie_goal_progress
            name: Progress
            min: 0
            max: 100
            severity:
              green: 80
              yellow: 40
              red: 0
          # Markdown, not a tile with state_content: a tile puts the goal on one
          # nowrap line and ellipsises anything past ~35 characters, which hides
          # exactly the detail worth reading.
          - type: markdown
            content: |-
              {%- set r = state_attr('sensor.cassie_goal_progress','reward') -%}
              {%- set t = state_attr('sensor.cassie_goal_progress','to_go') -%}
              {%- set pct = states('sensor.cassie_goal_progress') | int(0) -%}
              🎁 **{{ r }}**

              {{ pct }}% of the way there — {{ t }}
          # Rewards ABOVE the chores: the incentive is the reason the panel is
          # on the wall, and burying it under 11 tiles was the original mistake.
          - type: markdown
            content: |-
              {%- set p = states('sensor.cassie_choreops_points') | float(0) -%}
              {%- set rw = states.sensor
                    | selectattr('attributes.purpose','eq','purpose_reward_status')
                    | selectattr('attributes.user_name','eq','Cassie')
                    | sort(attribute='attributes.cost') -%}
              ### ⭐ Working towards
              {% for r in rw %}{%- set c = r.attributes.cost | float(1) -%}
              {%- set n = ((p / c * 12) | round(0, 'floor') | int) if c > 0 else 12 -%}
              {%- set f = 12 if n > 12 else n -%}
              - {{ '█' * f }}{{ '░' * (12 - f) }}  **{{ r.attributes.reward_name }}** · {{ c | round(0) | int }}{% if p >= c %} — ✅ **now**{% else %} — {{ (c - p) | round(0) | int }} to go{% endif %}
              {% endfor %}
            card_mod:
              style: |
                ha-card { background: rgba(5,12,20,.94);
                          border: 1px solid rgba(187,108,255,.35); border-radius: 22px; }
                h3 { letter-spacing: .04em; margin-bottom: 6px; }
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: Claim now
            filter:
              template: |-
                {% set p = states('sensor.cassie_choreops_points') | float(0) %}
                {% for s in states.sensor
                     | selectattr('attributes.purpose','eq','purpose_reward_status')
                     | selectattr('attributes.user_name','eq','Cassie')
                     | selectattr('attributes.cost','le', p) %}
                  {{ s.entity_id | replace('sensor.','button.')
                                 | replace('_reward_status_','_claim_reward_') }},
                {% endfor %}
          - type: heading
            heading: Chores
            heading_style: subtitle
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: sensor.cassie_choreops_chore_status_make_my_bed
                name: "Make my bed"
                icon: mdi:bed
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.cassie_choreops_claim_chore_make_my_bed
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.cassie_choreops_claim_chore_make_my_bed
              - type: tile
                entity: sensor.cassie_choreops_chore_status_get_dressed_for_school
