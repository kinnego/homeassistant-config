title: Alyssa
background: "#03070d"

# Alyssa's own page. Deliberately contains ONLY her data - her points, her
# goal, her jobs, her rewards. Note this is presentation, not access control:
# there are no per-child logins, so nothing stops one girl opening the other's
# page. It just means neither is looking at the other's numbers by default.

views:
  - title: Alyssa
    path: home
    icon: mdi:star-circle
    theme: Lugh Energy Kiosk
    type: sections
    max_columns: 2

    kiosk_mode:
      kiosk: true
      hide_header: true
      hide_sidebar: true

    sections:
      - type: grid
        column_span: 2
        cards:
          - type: markdown
            content: |-
              {%- set p = states('sensor.alyssa_choreops_points') | int(0) -%}
              {%- set left = state_attr('sensor.alyssa_choreops_chores','chore_stat_current_due_today') | int(0) -%}
              {%- set done = state_attr('sensor.alyssa_choreops_chores','chore_stat_approved_today') | int(0) -%}
              # 🌸 Alyssa
              
              # {{ p }} points
              
              {% if left %}**{{ left }}** {{ 'job' if left == 1 else 'jobs' }} still to do today{% else %}All done for today! 🎉{% endif %}{% if done %} · {{ done }} finished{% endif %}
            card_mod:
              style: |
                ha-card { background: linear-gradient(135deg, rgba(18,8,30,.95), rgba(6,13,23,.95));
                          border: 1px solid rgba(57,213,255,.35); border-radius: 22px; padding: 4px 18px; }
                h1 { letter-spacing: .10em; color: #D2A4FF; margin: 2px 0; font-size: 30px; }

      - type: grid
        column_span: 2
        cards:
          - type: heading
            heading: What I am saving for
            icon: mdi:target
          # select-options renders the choices as tappable pills rather than a
          # dropdown - a 4-year-old is not going to work a select menu.
          - type: tile
            entity: input_select.alyssa_reward_goal
            name: My goal
            icon: mdi:target
            features:
              - type: select-options
          - type: gauge
            entity: sensor.alyssa_goal_progress
            name: How close I am
            min: 0
            max: 100
            severity:
              green: 80
              yellow: 40
              red: 0
          # Markdown, not a tile with state_content: a tile puts the goal on one
          # nowrap line and ellipsises anything past ~35 characters, which hides
          # exactly the detail worth reading.
          - type: markdown
            content: |-
              {%- set r = state_attr('sensor.alyssa_goal_progress','reward') -%}
              {%- set t = state_attr('sensor.alyssa_goal_progress','to_go') -%}
              {%- set pct = states('sensor.alyssa_goal_progress') | int(0) -%}
              🎁 **{{ r }}**

              {{ pct }}% of the way there — {{ t }}

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: My jobs
            icon: mdi:checkbox-marked-circle-outline
          - type: grid
            columns: 3
            square: false
            cards:
              - type: tile
                entity: sensor.alyssa_choreops_chore_status_brush_my_teeth
                name: "Brush my teeth"
                icon: mdi:toothbrush-paste
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_brush_my_teeth
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_brush_my_teeth
              - type: tile
                entity: sensor.alyssa_choreops_chore_status_put_my_toys_away
                name: "Put my toys away"
                icon: mdi:teddy-bear
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_put_my_toys_away
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_put_my_toys_away
              - type: tile
                entity: sensor.alyssa_choreops_chore_status_get_dressed_all_by_myself
                name: "Get dressed all by myself"
                icon: mdi:tshirt-crew-outline
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_get_dressed_all_by_myself
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_get_dressed_all_by_myself
              - type: tile
                entity: sensor.alyssa_choreops_chore_status_shoes_and_coat_away
                name: "Shoes and coat away"
                icon: mdi:shoe-formal
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_shoes_and_coat_away
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_shoes_and_coat_away
              - type: tile
                entity: sensor.alyssa_choreops_chore_status_clothes_in_the_laundry_basket
                name: "Clothes in the laundry basket"
                icon: mdi:basket-outline
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_clothes_in_the_laundry_basket
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_clothes_in_the_laundry_basket
              - type: tile
                entity: sensor.alyssa_choreops_chore_status_help_put_the_spoons_out
                name: "Help put the spoons out"
                icon: mdi:spoon-sugar
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_help_put_the_spoons_out
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_help_put_the_spoons_out
              - type: tile
                entity: sensor.alyssa_choreops_chore_status_tidy_the_playroom_together
                name: "Tidy the playroom together"
                icon: mdi:toy-brick
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_tidy_the_playroom_together
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_tidy_the_playroom_together
              - type: tile
                entity: sensor.alyssa_choreops_chore_status_tidy_the_living_room
                name: "Tidy the living room"
                icon: mdi:sofa-outline
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_tidy_the_living_room
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_tidy_the_living_room
              - type: tile
                entity: sensor.alyssa_choreops_chore_status_no_sweets_all_day
                name: "No sweets all day"
                icon: mdi:candy-off-outline
                vertical: true
                tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_no_sweets_all_day
                icon_tap_action:
                  action: perform-action
                  perform_action: button.press
                  target:
                    entity_id: button.alyssa_choreops_claim_chore_no_sweets_all_day

      - type: grid
        column_span: 1
        cards:
          - type: heading
            heading: My rewards
            icon: mdi:gift-outline
          - type: markdown
            content: |-
              {%- set p = states('sensor.alyssa_choreops_points') | float(0) -%}
              {%- set rw = states.sensor
                    | selectattr('attributes.purpose','eq','purpose_reward_status')
                    | selectattr('attributes.user_name','eq','Alyssa')
                    | sort(attribute='attributes.cost') -%}
              {% for r in rw %}{%- set c = r.attributes.cost | float(1) -%}
              {%- set q = ((p / c * 12) | round(0, 'floor') | int) if c > 0 else 12 -%}
              {%- set f = 12 if q > 12 else q -%}
              - {{ '█' * f }}{{ '░' * (12 - f) }}  **{{ r.attributes.reward_name }}** · {{ c | round(0) | int }}{% if p >= c %} — ✅ **I can have this!**{% else %} — {{ (c - p) | round(0) | int }} to go{% endif %}
              {% endfor %}
            card_mod:
              style: |
                ha-card { background: rgba(5,12,20,.94);
                          border: 1px solid rgba(57,213,255,.35); border-radius: 22px; }
          - type: custom:auto-entities
            show_empty: false
            card:
              type: entities
              title: I can claim these now
            filter:
              template: |-
                {% set p = states('sensor.alyssa_choreops_points') | float(0) %}
                {% for s in states.sensor
                     | selectattr('attributes.purpose','eq','purpose_reward_status')
                     | selectattr('attributes.user_name','eq','Alyssa')
                     | selectattr('attributes.cost','le', p) %}
                  {{ s.entity_id | replace('sensor.','button.')
                                 | replace('_reward_status_','_claim_reward_') }},
                {% endfor %}
