homeassistant:
  # Needed by the Companion app and by notification "open URL" actions when
  # away from the house. Without it HA has no idea what its public address is.
  external_url: "https://lugh.cathaldoherty.me"
  internal_url: "http://192.168.1.28:8123"
  auth_providers:
    # Scoped to the wall-panel Pi only (192.168.1.82) so it can auto-start the
    # kiosk without a login. Was 192.168.1.0/24, which silently signed EVERY
    # Depends on the Pi keeping .82 - needs a DHCP reservation on the router.
    - type: trusted_networks
      trusted_networks:
        - 192.168.1.82/32
        # --- iPad chore kiosk (/lugh-chores/chores) ---------------------------
        # To enable: RESERVE THE IPAD'S LEASE ON THE ROUTER FIRST, then replace
        # the two X's below with its address and uncomment both lines. The Wall
        # Panel account has already drifted across .82, .28, .101 and .91, so an
        # unreserved address here would eventually hand passwordless access to
        # whatever device inherits the lease.
        # - 192.168.1.X/32
      trusted_users:
        192.168.1.82/32:
          - a7496fba6c524bb8a0c8b0eef0d097db
        # Reuses the existing "Wall Panel" user, which is in the Users group,
        # NOT Administrators - deliberate, a bypassed login must never be admin.
        # 192.168.1.X/32:
        #   - a7496fba6c524bb8a0c8b0eef0d097db
      allow_bypass_login: true
    - type: homeassistant
    
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

# ------------------------------------------------------------ HTTP / PROXY --
# Behind a Cloudflare Tunnel. cloudflared runs with --network host and dials
# http://127.0.0.1:8123, and Home Assistant is itself network_mode: host, so
# the only address HA ever sees the proxy arrive from is loopback. That keeps
# trusted_proxies to a single /32 rather than a docker bridge range.
#
# Do NOT widen this. Trusting a broader range would let anything else on that
# network spoof X-Forwarded-For and defeat IP banning / rate limiting.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1/32
  # With XFF trusted above, HA sees real client IPs, so these act on the
  # actual attacker rather than on the tunnel.
  ip_ban_enabled: true
  login_attempts_threshold: 5

# ------------------------------------------------------------ REWARD GOALS --
# What each girl is currently saving towards. The gauge on the chore dashboards
# reads this, so "32%" always means 32% of the thing she actually chose rather
# than of whatever happened to be cheapest.
#
# These options are a STATIC COPY of the reward names in ChoreOps. If a reward
# is renamed or added there, update this list too - nothing syncs it.
input_select:
  cassie_reward_goal:
    name: Cassie is saving for
    icon: mdi:target
    options:
      - "30 minutes extra screen time"
      - "Pick tonight's dinner"
      - "Pick the Friday film"
      - "Treat at the shop"
      - "Stay up 30 minutes late (weekend)"
      - "2 euro pocket money"
      - "Day out - playground or swimming"
  alyssa_reward_goal:
    name: Alyssa is saving for
    icon: mdi:target
    options:
      - "30 minutes extra screen time"
      - "Pick tonight's dinner"
      - "Pick the Friday film"
      - "Treat at the shop"
      - "Stay up 30 minutes late (weekend)"
      - "2 euro pocket money"
      - "Day out - playground or swimming"

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# ---------------------------------------------------------------- TARIFF --
# Electricity pricing. EDIT THE FOUR NUMBERS BELOW if the tariff changes.
#   Day rate      0.4016 EUR/kWh
#   EV window     0.0942 EUR/kWh   <-- window is ASSUMED 02:00-06:00, see EV_WINDOW
#   Export (SEG)  0.1850 EUR/kWh   (set in .storage/energy as number_energy_price_export)
#   Standing      337.02 EUR/year, billed as 12 instalments of 28.09 -> 0.92 EUR/day
template:
  # SINGLE SOURCE OF TRUTH for the cheap-rate window. Change the hours here
  # only — the unit-rate sensor and the tariff-switching automation both read
  # this, so they can never drift apart.
  - binary_sensor:
      - name: "EV Tariff Window"
        unique_id: ev_tariff_window
        icon: mdi:clock-time-two-outline
        state: >-
          {% set h = now().hour %}
          {{ 2 <= h < 6 }}

  - sensor:
      # Progress towards the reward selected in input_select.cassie_reward_goal.
      # Native 0-100 number so a core gauge card can render it - no markdown,
      # no card_mod, no custom cards anywhere in this path.
      - name: "Cassie Goal Progress"
        unique_id: cassie_goal_progress
        unit_of_measurement: "%"
        state: >-
          {% set p = states('sensor.cassie_choreops_points') | float(0) %}
          {% set goal = states('input_select.cassie_reward_goal') %}
          {% set r = states.sensor
               | selectattr('attributes.purpose','eq','purpose_reward_status')
               | selectattr('attributes.user_name','eq','Cassie')
               | selectattr('attributes.reward_name','eq', goal) | list %}
          {% if r %}{{ [ p / (r[0].attributes.cost | float(1)) * 100, 100 ] | min | round(0) }}{% else %}0{% endif %}
        attributes:
          reward: >-
            {{ states('input_select.cassie_reward_goal') }}
          cost: >-
            {% set goal = states('input_select.cassie_reward_goal') %}
            {% set r = states.sensor
                 | selectattr('attributes.purpose','eq','purpose_reward_status')
                 | selectattr('attributes.user_name','eq','Cassie')
                 | selectattr('attributes.reward_name','eq', goal) | list %}
            {% if r %}{{ r[0].attributes.cost | round(0) | int }} points{% else %}unknown{% endif %}
          to_go: >-
            {% set p = states('sensor.cassie_choreops_points') | float(0) %}
            {% set goal = states('input_select.cassie_reward_goal') %}
            {% set r = states.sensor
                 | selectattr('attributes.purpose','eq','purpose_reward_status')
                 | selectattr('attributes.user_name','eq','Cassie')
                 | selectattr('attributes.reward_name','eq', goal) | list %}
            {% if not r %}pick a goal
            {%- elif p >= (r[0].attributes.cost | float(0)) %}ready to claim
            {%- else %}{{ (r[0].attributes.cost | float(0) - p) | round(0) | int }} points to go{% endif %}

      # Progress towards the reward selected in input_select.alyssa_reward_goal.
      # Native 0-100 number so a core gauge card can render it - no markdown,
      # no card_mod, no custom cards anywhere in this path.
      - name: "Alyssa Goal Progress"
        unique_id: alyssa_goal_progress
        unit_of_measurement: "%"
        state: >-
          {% set p = states('sensor.alyssa_choreops_points') | float(0) %}
          {% set goal = states('input_select.alyssa_reward_goal') %}
          {% set r = states.sensor
               | selectattr('attributes.purpose','eq','purpose_reward_status')
               | selectattr('attributes.user_name','eq','Alyssa')
               | selectattr('attributes.reward_name','eq', goal) | list %}
          {% if r %}{{ [ p / (r[0].attributes.cost | float(1)) * 100, 100 ] | min | round(0) }}{% else %}0{% endif %}
        attributes:
          reward: >-
            {{ states('input_select.alyssa_reward_goal') }}
          cost: >-
            {% set goal = states('input_select.alyssa_reward_goal') %}
            {% set r = states.sensor
                 | selectattr('attributes.purpose','eq','purpose_reward_status')
                 | selectattr('attributes.user_name','eq','Alyssa')
                 | selectattr('attributes.reward_name','eq', goal) | list %}
            {% if r %}{{ r[0].attributes.cost | round(0) | int }} points{% else %}unknown{% endif %}
          to_go: >-
            {% set p = states('sensor.alyssa_choreops_points') | float(0) %}
            {% set goal = states('input_select.alyssa_reward_goal') %}
            {% set r = states.sensor
                 | selectattr('attributes.purpose','eq','purpose_reward_status')
                 | selectattr('attributes.user_name','eq','Alyssa')
                 | selectattr('attributes.reward_name','eq', goal) | list %}
            {% if not r %}pick a goal
            {%- elif p >= (r[0].attributes.cost | float(0)) %}ready to claim
            {%- else %}{{ (r[0].attributes.cost | float(0) - p) | round(0) | int }} points to go{% endif %}

  - sensor:
      # Fed to the energy dashboard as the grid import price, so Home Assistant
      # integrates cost properly across the rate change instead of applying one
      # flat rate to the whole day.
      - name: "Electricity Unit Rate"
        unique_id: electricity_unit_rate
        # No device_class: it is a price *rate* (EUR/kWh), not a monetary
        # total, and device_class monetary forbids state_class measurement.
        unit_of_measurement: "EUR/kWh"
        state_class: measurement
        icon: mdi:cash-clock
        # Reads the window from binary_sensor.ev_tariff_window. If that is not
        # yet initialised this falls back to the DAY rate, which overstates
        # rather than understates cost — the safe direction to be wrong in.
        state: >-
          {{ 0.0942 if is_state('binary_sensor.ev_tariff_window','on') else 0.4016 }}
        attributes:
          rate_name: >-
            {{ 'EV window' if is_state('binary_sensor.ev_tariff_window','on') else 'Day rate' }}

      - name: "Electricity Standing Charge Daily"
        unique_id: electricity_standing_charge_daily
        unit_of_measurement: "EUR"
        icon: mdi:calendar-clock
        # 337.02 per YEAR, split over 12 monthly instalments of 28.09.
        # Daily accrual is what the cost cards use.
        state: "{{ (337.02 / 365) | round(4) }}"

# Long-run totals so the yearly breakdown becomes real data rather than a
# projection. These start from zero today and accumulate.
utility_meter:
  grid_import_monthly:
    source: sensor.kinnegoz_myenergi_kinnegoz_grid_import_today
    cycle: monthly
  grid_import_yearly:
    source: sensor.kinnegoz_myenergi_kinnegoz_grid_import_today
    cycle: yearly
  grid_export_monthly:
    source: sensor.kinnegoz_myenergi_kinnegoz_grid_export_today
    cycle: monthly
  grid_export_yearly:
    source: sensor.kinnegoz_myenergi_kinnegoz_grid_export_today
    cycle: yearly
  solar_generated_monthly:
    source: sensor.kinnegoz_myenergi_kinnegoz_generated_today
    cycle: monthly
  solar_generated_yearly:
    source: sensor.kinnegoz_myenergi_kinnegoz_generated_today
    cycle: yearly
  ev_charging_monthly:
    source: sensor.outside_zappi_myenergi_zappi_20250975_energy_used_today
    cycle: monthly
  ev_charging_yearly:
    source: sensor.outside_zappi_myenergi_zappi_20250975_energy_used_today
    cycle: yearly
  hot_water_monthly:
    source: sensor.eddi_myenergi_eddi_23541285_energy_used_today
    cycle: monthly
  hot_water_yearly:
    source: sensor.eddi_myenergi_eddi_23541285_energy_used_today
    cycle: yearly
  # Money. Sources are the cost sensors Home Assistant generates from the
  # energy prefs; those reset daily, so these accumulate the real spend
  # across the rate change rather than applying a blended guess.
  electricity_cost_monthly:
    source: sensor.kinnegoz_myenergi_kinnegoz_grid_import_today_cost
    cycle: monthly
  electricity_cost_yearly:
    source: sensor.kinnegoz_myenergi_kinnegoz_grid_import_today_cost
    cycle: yearly
  export_credit_monthly:
    source: sensor.kinnegoz_myenergi_kinnegoz_grid_export_today_compensation
    cycle: monthly
  export_credit_yearly:
    source: sensor.kinnegoz_myenergi_kinnegoz_grid_export_today_compensation
    cycle: yearly
  # Cheap-window vs day-rate split. Each of these creates two sensors
  # (_ev_window, _day_rate) plus a select.<name> that the automation
  # "Switch energy tariff at EV window boundaries" flips at 02:00 and 06:00.
  # Answers "how much of this was cheap grid vs expensive grid".
  grid_import_split:
    source: sensor.kinnegoz_myenergi_kinnegoz_grid_import_today
    cycle: daily
    tariffs:
      - ev_window
      - day_rate
  hot_water_split:
    source: sensor.eddi_myenergi_eddi_23541285_energy_used_today
    cycle: daily
    tariffs:
      - ev_window
      - day_rate
  ev_charging_split:
    source: sensor.outside_zappi_myenergi_zappi_20250975_energy_used_today
    cycle: daily
    tariffs:
      - ev_window
      - day_rate

# Lugh dashboard — YAML-managed so it can be reviewed and version controlled.
lovelace:
  mode: storage
  resources:
    - url: /local/community/card-mod/card-mod.js
      type: module
    - url: /local/community/layout-card/layout-card.js
      type: module
  dashboards:
    lugh-command-centre:
      mode: yaml
      title: Lugh
      icon: mdi:home-lightning-bolt
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/lugh-command-centre.yaml
    # Kiosk-first energy view for iPad/phone. Auth is unchanged — this does not
    # widen the trusted_networks rule above.
    lugh-energy:
      mode: yaml
      title: Lugh Energy
      icon: mdi:lightning-bolt-circle
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/lugh-energy-kiosk.yaml
    lugh-family:
      mode: yaml
      title: Lugh Family
      icon: mdi:home-heart
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/lugh-family-kiosk.yaml
    # Camera wall, sized for a phone. Cards use camera_view: auto so they show
    # a still until tapped — continuous streams over the Cloudflare tunnel are
    # both heavy and awkward under Cloudflare's free-plan terms on video.
    lugh-cameras:
      mode: yaml
      title: Cameras
      icon: mdi:cctv
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/lugh-cameras.yaml
    # The out-and-about family app: to-do, shopping, calendar, ask Lugh.
    # HA requires a hyphen in the url_path, so this is family-app, not family.
    # https://lugh.cathaldoherty.me/family-app/today is what gets added to a
    # phone home screen.
    family-app:
      mode: yaml
      title: Family
      icon: mdi:home-heart
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/lugh-family-app.yaml
    # Kiosk build of the reward chart for a wall/counter iPad. Same content as
    # the Chores view in the Family app, but header/sidebar hidden and laid out
    # one girl per column. Auth is unchanged: the trusted_networks bypass is
    # still Pi-only, so the iPad logs in normally.
    lugh-chores:
      mode: yaml
      title: Chores
      icon: mdi:star-circle
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/lugh-chores-kiosk.yaml
    # One page per girl, showing only her own points, goal, jobs and rewards.
    # Presentation only - there are no per-child logins, so this is not access
    # control, just a page each rather than one shared scoreboard.
    lugh-cassie:
      mode: yaml
      title: Cassie
      icon: mdi:star
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/lugh-cassie.yaml
    lugh-alyssa:
      mode: yaml
      title: Alyssa
      icon: mdi:flower
      show_in_sidebar: true
      require_admin: false
      filename: dashboards/lugh-alyssa.yaml
